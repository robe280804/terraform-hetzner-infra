- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Reload apparmor rootlesskit
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/usr.bin.rootlesskit
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart docker rootless
  ansible.builtin.systemd_service:
    name: docker
    scope: user
    state: restarted
  become: true
  become_user: "{{ docker_rootless_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ docker_rootless_account.uid }}"
  ignore_errors: "{{ ansible_check_mode }}"
