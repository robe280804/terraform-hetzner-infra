- name: Restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
